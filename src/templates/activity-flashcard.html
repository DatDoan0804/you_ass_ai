<div class="yt-learn-flashcard-box" id="yt-learn-flashcard">
  <div class="yt-learn-flashcard-front" id="yt-learn-flashcard-front">
    <div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">FRONT (Click to flip)</div>
    <div style="font-size:16px;font-weight:600;">{{frontText}}</div>
  </div>
  <div class="yt-learn-flashcard-back" id="yt-learn-flashcard-back" style="display:none;">
    <div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">BACK</div>
    <div style="font-size:15px;color:#38bdf8;">{{backText}}</div>
  </div>
</div>
<div style="display:flex;justify-content:center;margin-top:12px;">
  <button class="yt-learn-btn yt-learn-btn-secondary" id="yt-learn-flip-btn">🔄 Flip Card</button>
</div>
