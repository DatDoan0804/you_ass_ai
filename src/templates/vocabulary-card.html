<div class="yt-learn-vocab-card-display">
  <div class="yt-learn-vocab-card-topbar">
    <span class="yt-learn-vocab-card-badge">Card {{current}} of {{total}}</span>
    {{timestampHtml}}
  </div>

  <div class="yt-learn-vocab-card-body">
    <div class="yt-learn-vocab-card-word">{{word}}</div>
    <div class="yt-learn-vocab-card-meaning">{{meaning}}</div>
    {{contextHtml}}
    {{exampleHtml}}
  </div>
</div>
