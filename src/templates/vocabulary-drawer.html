<div class="yt-learn-card yt-learn-vocab-card yt-learn-vocab-study">
  <div class="yt-learn-card-header">
    <div>
      <h3 class="yt-learn-concept-title" style="font-size:16px;">📖 Video Vocabulary List</h3>
      <div class="yt-learn-vocab-subtitle">Key terms and meanings before you watch</div>
    </div>
    {{closeButton}}
  </div>
  <div class="yt-learn-card-body">
    {{body}}
  </div>
  <div class="yt-learn-card-footer">
    <span>{{footerText}}</span>
    <button class="yt-learn-btn yt-learn-btn-primary" id="yt-learn-vocab-continue">{{continueButtonText}}</button>
  </div>
</div>
